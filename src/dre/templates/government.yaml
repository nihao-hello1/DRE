# ============================================================================
# 模板：GB/T 9704-2012 党政机关公文格式
# 继承 formal 的庄重风格，调整为公文规范
# ============================================================================
inherits: formal
name: "党政机关公文"
description: "GB/T 9704-2012 格式。红头文件、签发人、主送抄送"

page:
  margins:
    top: "3.7cm"
    bottom: "3.5cm"
    left: "2.8cm"
    right: "2.6cm"

styles:
  heading1:
    font_size: "22pt"
    alignment: center

  heading2:
    font_size: "16pt"
    bold: true

  body:
    font_name: "FangSong"    # 仿宋_GB2312 是公文标准字体
    font_size: "16pt"        # 三号
    first_line_indent: "0.74cm"

  list_item:
    font_name: "FangSong"
    font_size: "16pt"

toc:
  title: "目  录"
  levels: 3
